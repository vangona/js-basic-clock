<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Jebinson-Crusoe / Friday</title>
    <link href="./css/index.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div class="js-clock">
      <h1></h1>
    </div>
    <form class="js-form form">
      <input type="text" placeholder="이름이 있나요?" />
    </form>
    <h4 class="js-greetings greetings"></h4>
    <div class="content-box js-contentBox">
      <!-- 모드 전환 버튼 -->
      <div class="mode-toggle">
        <button class="js-modeBtn mode-btn" title="명언/할일 전환">
          <span class="mode-icon js-modeIcon">☰</span>
        </button>
      </div>

      <!-- 명언 모드 -->
      <div class="mode-panel mode-words js-modeWords showing">
        <h5 class="js-goodwords"></h5>
      </div>

      <!-- 할일 모드 -->
      <div class="mode-panel mode-todos js-modeTodos">
        <form class="js-toDoForm todo-form">
          <input type="text" placeholder="해야 할 일이 있나요?" />
        </form>
        <div class="todo-nav-bar js-todoNavBar" style="display:none">
          <button class="todo-nav-back js-todoNavBack">‹</button>
          <span class="todo-nav-title js-todoNavTitle"></span>
        </div>
        <ul class="js-toDoList"></ul>
      </div>

      <!-- 매트릭스 모드 -->
      <div class="mode-panel mode-matrix js-modeMatrix">
        <div class="matrix-grid">
          <div class="matrix-cell matrix-q1 js-matrixCell" data-quadrant="q1">
            <div class="matrix-label">긴급 + 중요</div>
            <ul class="matrix-list js-matrixList" data-quadrant="q1"></ul>
          </div>
          <div class="matrix-cell matrix-q3 js-matrixCell" data-quadrant="q3">
            <div class="matrix-label">긴급</div>
            <ul class="matrix-list js-matrixList" data-quadrant="q3"></ul>
          </div>
          <div class="matrix-cell matrix-q2 js-matrixCell" data-quadrant="q2">
            <div class="matrix-label">중요</div>
            <ul class="matrix-list js-matrixList" data-quadrant="q2"></ul>
          </div>
          <div class="matrix-cell matrix-q4 js-matrixCell" data-quadrant="q4">
            <div class="matrix-label">제거하기</div>
            <ul class="matrix-list js-matrixList" data-quadrant="q4"></ul>
          </div>
        </div>
        <div class="matrix-backlog js-matrixCell" data-quadrant="backlog">
          <div class="matrix-backlog-label">백로그</div>
          <ul class="matrix-list js-matrixList" data-quadrant="backlog"></ul>
        </div>
      </div>

      <!-- 사람 모드 -->
      <div class="mode-panel mode-people js-modePeople">
        <div class="people-list js-peopleList"></div>
        <div class="people-todos js-peopleTodos" style="display:none">
          <div class="people-nav">
            <button class="people-back js-peopleBack">&lsaquo;</button>
            <span class="people-name js-peopleName"></span>
          </div>
          <ul class="people-todo-list js-peopleTodoList"></ul>
        </div>
      </div>

      <!-- 몰입 모드 -->
      <div class="mode-panel mode-focus js-modeFocus">
        <ul class="focus-list js-focusList"></ul>
        <p class="focus-empty js-focusEmpty">몰입할 항목에 ★를 눌러보세요</p>
      </div>
    </div>

    <!-- 아카이브 햄버거 메뉴 (좌측 상단) -->
    <div class="archive-menu">
      <button class="js-archiveToggle archive-toggle" title="아카이브 메뉴">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="archive-panel js-archivePanel">
        <div class="archive-header">
          <h4>아카이브</h4>
          <button class="js-archiveDetail archive-detail-btn" title="상세 보기">상세</button>
        </div>
        <ul class="js-archiveList archive-list"></ul>
        <p class="archive-empty js-archiveEmpty">보관된 항목이 없습니다</p>
      </div>
    </div>
    <span class="js-weather"></span>

    <!-- 동기화 버튼 (좌측 하단) -->
    <div class="sync-status">
      <button class="js-syncBtn sync-btn" title="Google 로그인으로 동기화">☁</button>
      <span class="js-syncLabel sync-label"></span>
    </div>

    <!-- 아카이브 상세 모달 -->
    <div class="archive-modal-overlay js-archiveModal">
      <div class="archive-modal">
        <div class="archive-modal-header">
          <h3>아카이브</h3>
          <button class="js-archiveModalClose archive-modal-close">&times;</button>
        </div>
        <div class="archive-modal-tabs">
          <button class="archive-tab active js-tabTimeline">타임라인</button>
          <button class="archive-tab js-tabCalendar">캘린더</button>
          <div class="archive-date-toggle">
            <button class="date-toggle-btn active js-dateByCreated">생성일</button>
            <button class="date-toggle-btn js-dateByArchived">완료일</button>
          </div>
        </div>
        <div class="archive-modal-body">
          <!-- 타임라인 뷰 -->
          <div class="archive-view archive-timeline js-archiveTimeline"></div>
          <!-- 캘린더 뷰 -->
          <div class="archive-view archive-calendar js-archiveCalendar" style="display:none">
            <div class="calendar-nav">
              <button class="js-calPrev calendar-nav-btn">&lsaquo;</button>
              <span class="js-calTitle calendar-title"></span>
              <button class="js-calNext calendar-nav-btn">&rsaquo;</button>
            </div>
            <div class="calendar-weekdays">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="calendar-grid js-calGrid"></div>
            <div class="calendar-day-items js-calDayItems"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/storage.js"></script>
    <script src="./js/clock.js"></script>
    <script src="./js/greeting.js"></script>
    <script src="./js/todo.js"></script>
    <script src="./js/bg.js"></script>
    <script src="./js/goodwords.js"></script>
    <script src="./js/weather.js"></script>
    <script type="module" src="./js/firebase-config.js"></script>
  </body>
</html>
